<!DOCTYPE html>
<html>
<head>
    <title>Chromebook Puzzle Quest</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #2c3e50; color: white; text-align: center; padding: 50px; }
        .game-container { background: #34495e; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 500px; margin: auto; }
        input { padding: 10px; font-size: 18px; border-radius: 5px; border: none; margin-bottom: 10px; width: 80%; }
        button { padding: 10px 20px; font-size: 18px; cursor: pointer; background: #27ae60; color: white; border: none; border-radius: 5px; transition: 0.3s; }
        button:hover { background: #2ecc71; }
        #message { margin-top: 20px; font-weight: bold; }
        .stats { margin-bottom: 20px; font-size: 14px; color: #bdc3c7; }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>🧩 Puzzle Quest</h1>
        <div class="stats">
            Level: <span id="level">1</span> | Score: <span id="score">0</span>
        </div>
        
        <h2 id="puzzle-text">Loading puzzle...</h2>
        <input type="text" id="answer-input" placeholder="Type your answer here">
        <br>
        <button onclick="checkAnswer()">Submit Answer</button>
        <div id="message"></div>
        <br>
        <button onclick="resetGame()" style="background:#c0392b; font-size: 12px;">Reset Progress</button>
    </div>

    <script>
        // --- GAME DATA ---
        const puzzles = [
            { question: "What is 15 + 27?", answer: "42" },
            { question: "Unscramble: E M O R H C", answer: "CHROME" },
            { question: "What has keys but can't open locks?", answer: "keyboard" },
            { question: "What is 100 / 4?", answer: "25" },
            { question: "Unscramble: N O H T Y P", answer: "PYTHON" },
            { question: "I speak without a mouth and hear without ears. What am I?", answer: "echo" }
        ];

        let currentLevel = 0;
        let score = 0;

        // --- SAVE SYSTEM ---
        function loadGame() {
            const savedLevel = localStorage.getItem('puzzleLevel');
            const savedScore = localStorage.getItem('puzzleScore');
            
            if (savedLevel !== null) {
                currentLevel = parseInt(savedLevel);
                score = parseInt(savedScore);
                
                // If they finished all puzzles, loop back or stay at end
                if (currentLevel >= puzzles.length) {
                    showWinScreen();
                    return;
                }
            }
            updateUI();
        }

        function saveGame() {
            localStorage.setItem('puzzleLevel', currentLevel);
            localStorage.setItem('puzzleScore', score);
        }

        function resetGame() {
            if(confirm("Are you sure you want to delete your save?")) {
                localStorage.clear();
                location.reload();
            }
        }

        // --- GAME LOGIC ---
        function updateUI() {
            document.getElementById('level').innerText = currentLevel + 1;
            document.getElementById('score').innerText = score;
            document.getElementById('puzzle-text').innerText = puzzles[currentLevel].question;
            document.getElementById('answer-input').value = "";
            document.getElementById('message').innerText = "";
        }

        function checkAnswer() {
            const userInput = document.getElementById('answer-input').value.toLowerCase().trim();
            const correctAnswer = puzzles[currentLevel].answer.toLowerCase();

            if (userInput === correctAnswer) {
                score += 10;
                currentLevel++;
                saveGame();
                
                if (currentLevel < puzzles.length) {
                    document.getElementById('message').style.color = "#2ecc71";
                    document.getElementById('message').innerText = "Correct! Next Level...";
                    setTimeout(updateUI, 1500);
                } else {
                    showWinScreen();
                }
            } else {
                document.getElementById('message').style.color = "#e74c3c";
                document.getElementById('message').innerText = "Wrong answer! Try again.";
            }
        }

        function showWinScreen() {
            document.getElementById('puzzle-text').innerText = "🎉 YOU BEAT THE GAME!";
            document.getElementById('answer-input').style.display = "none";
            document.querySelector('button').style.display = "none";
            document.getElementById('message').innerText = `Final Score: ${score}`;
        }

        // Start the game
        loadGame();
    </script>
</body>
</html>
